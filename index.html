<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Football Manager Lite - משחק ניהול כדורגל</title>
  <meta name="description" content="משחק ניהול כדורגל מקורי בעברית - נהל קבוצה, שחק עונות, בצע העברות ונסה לזכות באליפות." />
  <meta name="theme-color" content="#0d1420" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FM Lite" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/ui/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
          /* התקנת PWA אופציונלית - כשל בהרשמה לא אמור לשבור את המשחק */
        });
      });
    }
  </script>
</body>
</html>
